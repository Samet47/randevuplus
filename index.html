
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>RandevuPlus | Çok Yakında</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #F8FAFC;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 42px 24px;
      border-radius: 24px;
      background: white;
      text-align: center;
      box-shadow: 0 12px 40px
        rgba(17, 24, 39, 0.08);
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      color: #705CF6;
      letter-spacing: -1px;
    }

    h1 {
      margin-top: 32px;
      font-size: 25px;
    }

    p {
      color: #64748B;
      line-height: 1.7;
    }

    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #F0EDFF;
      color: #705CF6;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">randevuplus</div>
    <h1>Randevun bir dokunuş uzağında.</h1>
    <p>
      Berber, kuaför ve güzellik salonu
      randevularını tek yerden yönet.
    </p>
    <div class="tag">Çok yakında!</div>
  </main>
</body>
</html>
