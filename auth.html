<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RandevuPlus | Hesabım</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f8fafc;color:#111827;font-family:system-ui,-apple-system,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{background:#fff;border-radius:24px;padding:30px 24px;width:100%;max-width:430px;box-shadow:0 14px 40px #11182712}.brand{text-align:center;color:#705cf6;font-size:32px;font-weight:800;letter-spacing:-1px;margin:0}.sub{text-align:center;color:#64748b;margin:10px 0 25px}.tabs{display:flex;background:#f1f3f9;border-radius:12px;padding:4px;gap:4px;margin-bottom:20px}.tabs button{flex:1;background:transparent;color:#475569;padding:11px;border:0;border-radius:10px;font-weight:700}.tabs button.active{background:white;color:#705cf6;box-shadow:0 1px 5px #0001}label{display:block;font-size:13px;font-weight:700;margin:15px 0 6px}input{width:100%;border:1px solid #d9dfeb;border-radius:11px;padding:13px;font-size:16px;outline:none}input:focus{border-color:#705cf6}button.primary{width:100%;border:0;background:#705cf6;color:white;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-top:22px}button:disabled{opacity:.55}button{cursor:pointer}.message{margin-top:16px;padding:12px;border-radius:10px;background:#f1f3f9;color:#334155;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.message:empty{display:none}.message.error{background:#fef2f2;color:#b91c1c}.message.ok{background:#f0fdf4;color:#166534}.hidden{display:none}.profile{background:#f8fafc;border-radius:12px;padding:16px;overflow-wrap:anywhere}.muted{color:#64748b;font-size:13px}.secondary{width:100%;border:1px solid #ddd6fe;background:white;color:#705cf6;padding:13px;border-radius:12px;font-weight:700;margin-top:12px}
</style>
</head>
<body><main class="card">
<h1 class="brand">randevuplus</h1><p class="sub">Randevun bir dokunuş uzağında.</p>
<section id="guest"><div class="tabs"><button id="loginTab" class="active" type="button">Giriş Yap</button><button id="signupTab" type="button">Kayıt Ol</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label for="fullName">Ad soyad</label><input id="fullName" autocomplete="name" maxlength="100"></div><label for="email">E-posta</label><input id="email" type="email" autocomplete="email" required><label for="password">Şifre (en az 8 karakter)</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><button class="primary" id="submitBtn" type="submit">Giriş Yap</button></form></section>
<section id="member" class="hidden"><h2>Hoş geldin!</h2><div class="profile"><div class="muted">E-posta</div><strong id="memberEmail"></strong><div class="muted" style="margin-top:12px">Ad soyad</div><strong id="memberName"></strong></div><button class="secondary" id="logoutBtn" type="button">Çıkış Yap</button></section>
<div id="message" class="message" role="status" aria-live="polite"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Yalnızca Project URL ve sb_publishable_ anahtarını gir.
// Secret/service_role anahtarını ASLA buraya koyma.
const SUPABASE_URL = 'https://samet47.github.io/randevuplus/';
const SUPABASE_KEY = 'sb_publishable_VXj5OaVOGo3RoGcdhGw8AQ_WWOdq5sL';
const SITE_URL = 'https://samet47.github.io/randevuplus/';
const $ = id => document.getElementById(id);
const msg = (text, kind='') => { $('message').textContent=text; $('message').className='message '+kind; };
let mode='login'; let client;
function switchMode(next){mode=next;$('loginTab').classList.toggle('active',next==='login');$('signupTab').classList.toggle('active',next==='signup');$('nameWrap').classList.toggle('hidden',next!=='signup');$('fullName').required=next==='signup';$('password').autocomplete=next==='signup'?'new-password':'current-password';$('submitBtn').textContent=next==='signup'?'Kayıt Ol':'Giriş Yap';msg('');}
$('loginTab').onclick=()=>switchMode('login');$('signupTab').onclick=()=>switchMode('signup');
function render(user){$('guest').classList.toggle('hidden',!!user);$('member').classList.toggle('hidden',!user);if(user){$('memberEmail').textContent=user.email||'';$('memberName').textContent=user.user_metadata?.full_name||'Belirtilmedi';}}
async function init(){if(!window.supabase){msg('Supabase kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.','error');return;}if(SUPABASE_URL.includes('BURAYA_')||SUPABASE_KEY.includes('BURAYA_')){msg('Önce kodun içindeki Project URL ve publishable key bilgilerini doldur.','error');return;}try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data,error}=await client.auth.getUser();if(error && !/session missing/i.test(error.message))console.warn(error);render(data?.user||null);client.auth.onAuthStateChange((_event,session)=>render(session?.user||null));}catch(e){msg('Başlatma hatası: '+e.message,'error');}}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();if(!client){msg('Supabase bağlantısı hazır değil.','error');return;}const email=$('email').value.trim(),password=$('password').value;const btn=$('submitBtn');btn.disabled=true;try{if(mode==='signup'){const full_name=$('fullName').value.trim();if(!full_name){msg('Ad soyad gir.','error');return;}const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name},emailRedirectTo:SITE_URL+'auth.html'}});if(error)throw error;msg(data.session?'Kayıt ve giriş başarılı.':'Kayıt isteği alındı. Gelen kutunu kontrol et ve doğrulama bağlantısına dokun. Hesap zaten varsa da güvenlik nedeniyle benzer mesaj gösterilebilir.','ok');}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;msg('Giriş başarılı.','ok');}}catch(err){msg('İşlem başarısız: '+err.message,'error');}finally{btn.disabled=false;}});
$('logoutBtn').onclick=async()=>{if(!client)return;const {error}=await client.auth.signOut();if(error)msg('Çıkış yapılamadı: '+error.message,'error');else msg('Oturum kapatıldı.','ok');};
init();
</script></body></html>
